<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>MyCraft</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="crosshair"></div>

  <div id="hud">
    <div id="hint">Click to play</div>
    <div id="controls-info">
      WASD move &nbsp;·&nbsp; Space jump &nbsp;·&nbsp; Mouse look<br/>
      Left click: break &nbsp;·&nbsp; Right click: place &nbsp;·&nbsp; Esc: release mouse
    </div>
  </div>

  <!-- Touch controls (shown only on touch devices, see main.js) -->
  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>

    <div id="touch-action-buttons">
      <button id="btn-place" class="touch-btn" aria-label="Place block">+</button>
      <button id="btn-break" class="touch-btn" aria-label="Break block">×</button>
      <button id="btn-jump" class="touch-btn" aria-label="Jump">↑</button>
    </div>

    <!-- Invisible full-right-side layer that captures drag-to-look -->
    <div id="look-zone"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
